<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JARVIS ARCHITECT V4</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }

        /* VIDEO LAYER */
        #input_video { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; transform: scaleX(-1); opacity: 0.5; z-index: 0;
        }

        /* HUD LAYER */
        #hud {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            color: #00ffff; pointer-events: none; font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
        }

        /* LOADING CIRCLE (The Arc Reactor) */
        #loader-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.9); z-index: 20;
            transition: opacity 0.8s;
        }
        .circle {
            width: 120px; height: 120px;
            border: 5px solid rgba(0, 255, 255, 0.1);
            border-top: 5px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 30px #00ffff;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hidden { opacity: 0; pointer-events: none; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loader-container">
        <div class="circle"></div>
        <div style="color:#00ffff; letter-spacing: 2px;">INITIALIZING SYSTEM...</div>
    </div>

    <div id="hud">
        STATUS: <span id="sys_status">OFFLINE</span><br>
        VOXELS: <span id="count">0</span><br>
        <div style="font-size: 10px; margin-top: 5px; opacity: 0.8;">
            [R] PINCH: DRAW<br>
            [L] PINCH: ERASE BLOCK<br>
            [L] FIST: RESET SYSTEM<br>
            [L] PALM: ROTATE
        </div>
    </div>

    <video id="input_video" playsinline></video>

    <script>
        // --- 1. CONFIGURATION ---
        const CONFIG = {
            gridSize: 0.8,
            smoothing: 0.15, // 0.1 = Very Stable, 0.3 = Fast
            pinchThreshold: 0.05,
            maxBlocks: 1500
        };

        // --- 2. THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const world = new THREE.Group(); // All blocks live here
        scene.add(world);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 3. MATERIALS ---
        // Blue Block (Placed)
        const blockGeo = new THREE.BoxGeometry(CONFIG.gridSize, CONFIG.gridSize, CONFIG.gridSize);
        const blockMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending 
        });
        const blockWire = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, opacity: 0.3, transparent: true });

        // Instanced Mesh
        const meshSolid = new THREE.InstancedMesh(blockGeo, blockMat, CONFIG.maxBlocks);
        const meshWire = new THREE.InstancedMesh(blockGeo, blockWire, CONFIG.maxBlocks);
        world.add(meshSolid);
        world.add(meshWire);

        // Cursor (Right Hand - Builder)
        const cursorMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.4 });
        const cursor = new THREE.Mesh(blockGeo, cursorMat);
        scene.add(cursor); // Cursor is separate from world rotation for easier aiming

        // Eraser (Left Hand - Destroyer)
        const eraserMat = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true, transparent: true, opacity: 0.8 });
        const eraserCursor = new THREE.Mesh(blockGeo, eraserMat);
        scene.add(eraserCursor);
        eraserCursor.visible = false; // Hide until left hand pinch

        // Init Blocks (Hide them)
        const dummy = new THREE.Object3D();
        const voxelMap = new Map(); // Store positions to find/delete blocks
        
        function clearAllBlocks() {
            for(let i=0; i<CONFIG.maxBlocks; i++){
                dummy.position.set(0,0,1000);
                dummy.updateMatrix();
                meshSolid.setMatrixAt(i, dummy.matrix);
                meshWire.setMatrixAt(i, dummy.matrix);
            }
            meshSolid.instanceMatrix.needsUpdate = true;
            meshWire.instanceMatrix.needsUpdate = true;
            voxelMap.clear();
            voxelCount = 0;
            document.getElementById('count').innerText = 0;
        }
        clearAllBlocks();

        let voxelCount = 0;

        // --- 4. STABILIZATION & STATE ---
        let smoothHand = { x: 0, y: 0 }; 
        let targetHand = { x: 0, y: 0 };
        let smoothErase = { x: 0, y: 0 };
        let systemActive = false;

        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        // --- 5. MEDIAPIPE LOGIC ---
        const loader = document.getElementById('loader-container');
        const statusLabel = document.getElementById('sys_status');

        function onResults(results) {
            // ACTIVATE SYSTEM ON FIRST HAND DETECT
            if (!systemActive && results.multiHandLandmarks.length > 0) {
                systemActive = true;
                loader.classList.add('hidden');
                statusLabel.innerText = "ONLINE";
                statusLabel.style.color = "#00ff00";
            }

            // HIDE CURSORS DEFAULT
            cursor.visible = false;
            eraserCursor.visible = false;

            if (results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const label = results.multiHandedness[index].label; 
                    
                    // =================================================
                    // RIGHT HAND (BUILDER) - Label "Left" (Mirrored)
                    // =================================================
                    if (label === "Left") { 
                        cursor.visible = true;
                        const indexTip = landmarks[8];
                        const thumbTip = landmarks[4];
                        
                        // 1. PINCH CHECK
                        const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                        const isPinching = dist < CONFIG.pinchThreshold;

                        // 2. COORDINATES
                        const x = (1 - indexTip.x) * 24 - 12;
                        const y = (1 - indexTip.y) * 18 - 9;
                        
                        // 3. STABILIZE
                        targetHand.x = x; targetHand.y = y;
                        smoothHand.x = lerp(smoothHand.x, targetHand.x, CONFIG.smoothing);
                        smoothHand.y = lerp(smoothHand.y, targetHand.y, CONFIG.smoothing);

                        // 4. MOVE CURSOR
                        cursor.position.set(smoothHand.x, smoothHand.y, 0);

                        // 5. DRAW LOGIC
                        if (isPinching) {
                            cursor.material.color.setHex(0x00ffff); // Blue
                            cursor.material.wireframe = false; // Solid
                            
                            // Snap to grid
                            const snapX = Math.round(smoothHand.x / CONFIG.gridSize) * CONFIG.gridSize;
                            const snapY = Math.round(smoothHand.y / CONFIG.gridSize) * CONFIG.gridSize;
                            const key = `${snapX},${snapY}`;

                            if (!voxelMap.has(key) && voxelCount < CONFIG.maxBlocks) {
                                dummy.position.set(snapX, snapY, 0);
                                dummy.updateMatrix();
                                meshSolid.setMatrixAt(voxelCount, dummy.matrix);
                                meshWire.setMatrixAt(voxelCount, dummy.matrix);
                                
                                meshSolid.instanceMatrix.needsUpdate = true;
                                meshWire.instanceMatrix.needsUpdate = true;
                                
                                voxelMap.set(key, voxelCount); // Store index for eraser
                                voxelCount++;
                                document.getElementById('count').innerText = voxelCount;
                            }
                        } else {
                            cursor.material.color.setHex(0xffffff); // White
                            cursor.material.wireframe = true; // Wireframe
                        }
                    }

                    // =================================================
                    // LEFT HAND (TOOLS) - Label "Right" (Mirrored)
                    // =================================================
                    if (label === "Right") {
                        const thumb = landmarks[4];
                        const indexF = landmarks[8];
                        const wrist = landmarks[0];
                        const middleF = landmarks[12];

                        // 1. FIST CHECK (RESET)
                        const isFist = (wrist.y < middleF.y); // Simple check: wrist below fingers? No, fingers below wrist
                        // Better Fist Check: Tips are close to palm base
                        const isFistBetter = landmarks[12].y > landmarks[9].y; // Tip below knuckle (inverted Y)
                        
                        if (landmarks[12].y > landmarks[9].y && landmarks[16].y > landmarks[13].y) {
                            // FIST DETECTED -> RESET
                            if(systemActive) {
                                systemActive = false;
                                loader.classList.remove('hidden');
                                statusLabel.innerText = "REBOOTING";
                                statusLabel.style.color = "red";
                                clearAllBlocks();
                                world.rotation.set(0,0,0);
                                setTimeout(() => { systemActive = true; loader.classList.add('hidden'); statusLabel.innerText = "ONLINE"; statusLabel.style.color="#00ff00"; }, 1500);
                            }
                        } 
                        else {
                            // 2. PINCH CHECK (ERASER)
                            const dist = Math.hypot(indexF.x - thumb.x, indexF.y - thumb.y);
                            if (dist < CONFIG.pinchThreshold) {
                                eraserCursor.visible = true;
                                // Move Eraser
                                const ex = (1 - indexF.x) * 24 - 12;
                                const ey = (1 - indexF.y) * 18 - 9;
                                smoothErase.x = lerp(smoothErase.x, ex, CONFIG.smoothing);
                                smoothErase.y = lerp(smoothErase.y, ey, CONFIG.smoothing);
                                eraserCursor.position.set(smoothErase.x, smoothErase.y, 0);

                                // DELETE BLOCK LOGIC
                                const snapX = Math.round(smoothErase.x / CONFIG.gridSize) * CONFIG.gridSize;
                                const snapY = Math.round(smoothErase.y / CONFIG.gridSize) * CONFIG.gridSize;
                                const key = `${snapX},${snapY}`;

                                if (voxelMap.has(key)) {
                                    const indexToDelete = voxelMap.get(key);
                                    
                                    // Hide block by moving to infinity
                                    dummy.position.set(0,0,1000); 
                                    dummy.updateMatrix();
                                    meshSolid.setMatrixAt(indexToDelete, dummy.matrix);
                                    meshWire.setMatrixAt(indexToDelete, dummy.matrix);
                                    
                                    meshSolid.instanceMatrix.needsUpdate = true;
                                    meshWire.instanceMatrix.needsUpdate = true;
                                    
                                    voxelMap.delete(key);
                                }
                            } 
                            // 3. OPEN PALM (ROTATE)
                            else {
                                // Rotate world based on hand position
                                const rotX = (landmarks[9].x - 0.5) * 2; 
                                world.rotation.y = rotX;
                            }
                        }
                    }
                });
            }
        }

        // --- 6. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            // Idle Animations
            if(cursor.visible) { cursor.rotation.x += 0.02; cursor.rotation.y += 0.02; }
            if(eraserCursor.visible) { eraserCursor.rotation.z -= 0.1; }
            
            renderer.render(scene, camera);
        }
        animate();

        // --- 7. INIT CAMERA ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults(onResults);

        const cam = new Camera(document.getElementById('input_video'), {
            onFrame: async () => await hands.send({image: document.getElementById('input_video')}),
            width: 1280, height: 720
        });
        cam.start();

    </script>
</body>
</html>
