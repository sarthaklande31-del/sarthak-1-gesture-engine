<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Iron Hand HUD</title>

<style>
html,body{
  margin:0;
  background:#000;
  overflow:hidden;
}
video,canvas{
  position:absolute;
  top:0;left:0;
}
#hudText{
  position:absolute;
  top:40px;
  width:100%;
  text-align:center;
  color:white;
  font-size:42px;
  font-weight:800;
  letter-spacing:1px;
}
#git{
  position:absolute;
  bottom:80px;
  width:100%;
  text-align:center;
  color:white;
  font-size:26px;
  opacity:.9;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

</head>
<body>

<div id="hudText">Ironman who? 🚀</div>
<div id="git">( Comment Git )</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults(onResults);

new Camera(video,{
  onFrame: async()=>hands.send({image:video}),
  width:640,
  height:480
}).start();

/* ---------------- CORE DATA ---------------- */

let voxels = [];
let lastPinch = false;

function drawVoxel(x,y){
  ctx.strokeStyle="#00f0ff";
  ctx.lineWidth=2;
  ctx.strokeRect(x-12,y-12,24,24);
}

/* ---------------- GESTURES ---------------- */

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function onResults(res){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  if(!res.multiHandLandmarks.length) return;
  const lm = res.multiHandLandmarks[0];

  /* Draw skeleton */
  ctx.strokeStyle="#00f0ff";
  ctx.lineWidth=2;
  for(let i=0;i<lm.length;i++){
    const x=lm[i].x*canvas.width;
    const y=lm[i].y*canvas.height;
    ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle="#00f0ff";
    ctx.fill();
  }

  /* Pinch detect */
  const pinch = dist(lm[4],lm[8]) < 0.035;
  const px = lm[8].x*canvas.width;
  const py = lm[8].y*canvas.height;

  if(pinch && !lastPinch){
    voxels.push({x:px,y:py});
  }
  lastPinch = pinch;

  /* Draw voxel stack */
  for(let i=0;i<voxels.length;i++){
    drawVoxel(px, py - i*26);
  }

  /* Ghost preview */
  drawVoxel(px,py);
}
</script>

</body>
</html>
