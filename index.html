<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IRON MAN V8 PRECISION</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }

        /* LAYER 1: VIDEO */
        #input_video { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            object-fit: cover; transform: scaleX(-1); 
            opacity: 0.5; z-index: 0;
        }

        /* LAYER 2: SKELETON LINES */
        #output_canvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            transform: scaleX(-1);
            z-index: 1; pointer-events: none;
        }

        /* LAYER 3: 3D BLOCKS */
        #three_canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 2;
        }

        /* LAYER 4: HUD */
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            color: #00ffff; font-weight: bold; pointer-events: none;
            background: rgba(0,0,0,0.5); padding: 10px; border: 1px solid #00ffff;
            border-radius: 5px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        SYSTEM: <span style="color:#0f0">ONLINE</span><br>
        BLOCKS: <span id="count">0</span><br>
        <div style="margin-top:5px; font-size:10px; color:#aaa; line-height: 1.5;">
        [R] PINCH: DRAW<br>
        [R] FIST: ROTATE 360°<br>
        [L] PINCH: ERASE<br>
        [L] PALM: RESET ALL
        </div>
    </div>

    <video id="input_video" autoplay muted playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        // --- 1. CONFIGURATION ---
        const CONFIG = {
            gridSize: 0.8,
            smoothing: 0.15, 
            pinchThreshold: 0.05,
            maxBlocks: 2000
        };

        // --- 2. THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const world = new THREE.Group(); // Rotating World Container
        scene.add(world);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 16;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.id = "three_canvas";
        document.body.appendChild(renderer.domElement);

        // --- 3. MATERIALS (THE IRON MAN LOOK) ---
        // Solid Blue Block
        const geometry = new THREE.BoxGeometry(CONFIG.gridSize, CONFIG.gridSize, CONFIG.gridSize);
        const blockMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending 
        });
        const wireMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, opacity: 0.3, transparent: true });

        // Instanced Mesh (Optimized for Mobile)
        const meshSolid = new THREE.InstancedMesh(geometry, blockMat, CONFIG.maxBlocks);
        const meshWire = new THREE.InstancedMesh(geometry, wireMat, CONFIG.maxBlocks);
        world.add(meshSolid);
        world.add(meshWire);

        // Hide all blocks initially
        const dummy = new THREE.Object3D();
        const voxelMap = new Map();
        let voxelCount = 0;

        function clearWorld() {
            for(let i=0; i<CONFIG.maxBlocks; i++){
                dummy.position.set(0,0,1000); dummy.updateMatrix();
                meshSolid.setMatrixAt(i, dummy.matrix);
                meshWire.setMatrixAt(i, dummy.matrix);
            }
            meshSolid.instanceMatrix.needsUpdate = true;
            meshWire.instanceMatrix.needsUpdate = true;
            voxelMap.clear();
            voxelCount = 0;
            world.rotation.set(0,0,0);
            document.getElementById('count').innerText = 0;
        }
        clearWorld();

        // --- 4. CURSORS & GIZMOS ---
        // Ghost Cursor (Right Hand)
        const cursor = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, opacity: 0.5, transparent: true }));
        scene.add(cursor);

        // Eraser Cursor (Left Hand)
        const eraser = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true }));
        scene.add(eraser);
        eraser.visible = false;

        // Rotation Ring (The "Circle Initialize")
        const ringGeo = new THREE.RingGeometry(1.2, 1.4, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        scene.add(ring);
        ring.visible = false;

        // --- 5. LOGIC STATE ---
        let smoothHand = { x: 0, y: 0 };
        let lastFistPos = { x: 0, y: 0 };
        let isRotating = false;

        function lerp(start, end, amt) { return (1-amt)*start + amt*end; }

        // --- 6. MEDIAPIPE LOGIC ---
        const videoElement = document.getElementById('input_video');
        const canvas2D = document.getElementById('output_canvas');
        const ctx2D = canvas2D.getContext('2d');
        
        canvas2D.width = window.innerWidth;
        canvas2D.height = window.innerHeight;

        function onResults(results) {
            // A. DRAW SKELETON (The Green Lines)
            ctx2D.save();
            ctx2D.clearRect(0, 0, canvas2D.width, canvas2D.height);
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(ctx2D, landmarks, HAND_CONNECTIONS, {color: '#00ffcc', lineWidth: 2});
                    drawLandmarks(ctx2D, landmarks, {color: '#ffffff', lineWidth: 1, radius: 2});
                }
            }
            ctx2D.restore();

            // B. INTERACTION LOGIC
            cursor.visible = false;
            eraser.visible = false;
            ring.visible = false;

            if (results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const label = results.multiHandedness[index].label; 
                    
                    // === RIGHT HAND (Label "Left") -> CREATOR ===
                    if (label === "Left") { 
                        const tip = landmarks[8];
                        const thumb = landmarks[4];
                        const pinch = Math.hypot(tip.x - thumb.x, tip.y - thumb.y) < CONFIG.pinchThreshold;
                        
                        // Fist Detection (Fingers curled)
                        const isFist = landmarks[12].y > landmarks[9].y && landmarks[16].y > landmarks[13].y;

                        // Coordinates
                        const x = (1 - tip.x) * 24 - 12;
                        const y = (1 - tip.y) * 18 - 9;
                        
                        // Stabilize
                        smoothHand.x = lerp(smoothHand.x, x, CONFIG.smoothing);
                        smoothHand.y = lerp(smoothHand.y, y, CONFIG.smoothing);

                        // MODE 1: ROTATION (FIST)
                        if (isFist) {
                            ring.visible = true; // Circle Initialize
                            ring.position.set(smoothHand.x, smoothHand.y, 0);
                            
                            if (!isRotating) {
                                lastFistPos = {x: smoothHand.x, y: smoothHand.y};
                                isRotating = true;
                            } else {
                                // Rotate World based on Drag
                                const dx = smoothHand.x - lastFistPos.x;
                                const dy = smoothHand.y - lastFistPos.y;
                                world.rotation.y += dx * 0.15;
                                world.rotation.x += dy * 0.15;
                                lastFistPos = {x: smoothHand.x, y: smoothHand.y};
                            }
                        } 
                        // MODE 2: DRAWING
                        else {
                            isRotating = false;
                            cursor.visible = true;
                            cursor.position.set(smoothHand.x, smoothHand.y, 0);

                            if (pinch) {
                                cursor.material.color.setHex(0x00ffff); // Solid Blue
                                cursor.material.wireframe = false; 
                                
                                // Snap & Place
                                const sx = Math.round(smoothHand.x / CONFIG.gridSize) * CONFIG.gridSize;
                                const sy = Math.round(smoothHand.y / CONFIG.gridSize) * CONFIG.gridSize;
                                const key = `${sx},${sy}`;

                                if (!voxelMap.has(key) && voxelCount < CONFIG.maxBlocks) {
                                    dummy.position.set(sx, sy, 0);
                                    dummy.updateMatrix();
                                    meshSolid.setMatrixAt(voxelCount, dummy.matrix);
                                    meshWire.setMatrixAt(voxelCount, dummy.matrix);
                                    
                                    meshSolid.instanceMatrix.needsUpdate = true;
                                    meshWire.instanceMatrix.needsUpdate = true;
                                    
                                    voxelMap.set(key, voxelCount);
                                    voxelCount++;
                                    document.getElementById('count').innerText = voxelCount;
                                }
                            } else {
                                cursor.material.color.setHex(0xffffff); // Ghost White
                                cursor.material.wireframe = true;
                            }
                        }
                    }

                    // === LEFT HAND (Label "Right") -> TOOLS ===
                    if (label === "Right") {
                        const tip = landmarks[8];
                        const thumb = landmarks[4];
                        const pinch = Math.hypot(tip.x - thumb.x, tip.y - thumb.y) < CONFIG.pinchThreshold;
                        
                        // Open Palm Detection
                        const isOpen = landmarks[8].y < landmarks[6].y && landmarks[12].y < landmarks[10].y && landmarks[16].y < landmarks[14].y;

                        // RESET (OPEN PALM)
                        if (isOpen && !pinch) {
                            clearWorld();
                        }
                        // ERASE (PINCH)
                        else if (pinch) {
                            eraser.visible = true;
                            const x = (1 - tip.x) * 24 - 12;
                            const y = (1 - tip.y) * 18 - 9;
                            eraser.position.set(x, y, 0);
                            
                            const sx = Math.round(x / CONFIG.gridSize) * CONFIG.gridSize;
                            const sy = Math.round(y / CONFIG.gridSize) * CONFIG.gridSize;
                            const key = `${sx},${sy}`;
                            
                            if(voxelMap.has(key)) {
                                const idx = voxelMap.get(key);
                                dummy.position.set(0,0,1000); dummy.updateMatrix();
                                meshSolid.setMatrixAt(idx, dummy.matrix);
                                meshWire.setMatrixAt(idx, dummy.matrix);
                                meshSolid.instanceMatrix.needsUpdate = true;
                                meshWire.instanceMatrix.needsUpdate = true;
                                voxelMap.delete(key);
                            }
                        }
                    }
                });
            }
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            if(ring.visible) ring.rotation.z -= 0.1; // Spin the init circle
            renderer.render(scene, camera);
        }
        animate();

        // --- START CAMERA ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const cam = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });
        cam.start();
    </script>
</body>
</html>
