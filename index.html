<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IRON HAND – Voxel Builder</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#05080d;
  font-family:system-ui;
}
#video{
  position:fixed;
  right:10px;
  bottom:10px;
  width:140px;
  opacity:.2;
  border-radius:10px;
}
#hud{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  color:#8affc1;
  font-size:13px;
  letter-spacing:.5px;
  opacity:.8;
}
</style>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>

<body>
<div id="hud">PINCH = CREATE / MOVE • OPEN PALM = CAMERA • DROP DOWN = DELETE</div>
<video id="video" autoplay playsinline></video>

<script>
/* ======================= SCENE ======================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080d);

const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);
camera.position.set(0,7,14);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* Lights */
scene.add(new THREE.AmbientLight(0xffffff,.25));
const dl=new THREE.DirectionalLight(0xffffff,1);
dl.position.set(6,12,6);
scene.add(dl);

/* Grid */
scene.add(new THREE.GridHelper(30,30));

/* ======================= IRON MAN RETICLE ======================= */

const reticle = new THREE.Mesh(
  new THREE.RingGeometry(.15,.2,32),
  new THREE.MeshBasicMaterial({color:0x00ffcc,transparent:true,opacity:.8})
);
reticle.rotation.x=-Math.PI/2;
scene.add(reticle);

/* ======================= VOXELS ======================= */

const cubeGeo=new THREE.BoxGeometry(1,1,1);
const voxels=[];
let activeVoxel=null;

function snap(v){
  return new THREE.Vector3(
    Math.round(v.x),
    Math.round(v.y),
    Math.round(v.z)
  );
}

function newVoxel(pos,ghost=false){
  const mat=new THREE.MeshStandardMaterial({
    color:ghost?0x00ffcc:0x4ade80,
    transparent:ghost,
    opacity:ghost?.35:1
  });
  const m=new THREE.Mesh(cubeGeo,mat);
  m.position.copy(snap(pos));
  scene.add(m);
  if(!ghost) voxels.push(m);
  return m;
}

let ghostVoxel=newVoxel(new THREE.Vector3(),true);

/* ======================= HAND TRACKING ======================= */

const video=document.getElementById("video");

const hands=new Hands({
  locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:.75,
  minTrackingConfidence:.75
});

hands.onResults(onHands);

new Camera(video,{
  onFrame:async()=>hands.send({image:video}),
  width:640,
  height:480
}).start();

/* ======================= GESTURES ======================= */

let pinch=false;
let smoothPos=new THREE.Vector3();
let camAngle=0;

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
}

function pinching(lm){ return dist(lm[4],lm[8])<0.04; }

function openPalm(lm){
  return dist(lm[8],lm[12])>0.1 && dist(lm[12],lm[16])>0.1;
}

function map(lm){
  return new THREE.Vector3(
    (lm.x-.5)*14,
    (.5-lm.y)*10,
    -lm.z*10
  );
}

/* ======================= CORE LOOP ======================= */

function onHands(res){
  if(!res.multiHandLandmarks.length) return;
  const lm=res.multiHandLandmarks[0];

  const target=map(lm[8]);
  smoothPos.lerp(target,.25);

  reticle.position.copy(snap(smoothPos));
  ghostVoxel.position.copy(snap(smoothPos));

  /* Camera orbit */
  if(openPalm(lm)){
    camAngle+=(lm[0].x-.5)*0.02;
    camera.position.x=Math.sin(camAngle)*14;
    camera.position.z=Math.cos(camAngle)*14;
    camera.lookAt(0,0,0);
    return;
  }

  /* Pinch logic */
  if(pinching(lm) && !pinch){
    pinch=true;
    activeVoxel=newVoxel(smoothPos);
  }

  if(pinch && activeVoxel){
    activeVoxel.position.copy(snap(smoothPos));
  }

  if(!pinching(lm) && pinch){
    pinch=false;

    if(activeVoxel.position.y<-2){
      scene.remove(activeVoxel);
    }

    activeVoxel=null;
  }
}

/* ======================= RENDER ======================= */

function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
