
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEXUS: VOXEL ARCHITECT</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        /* FIX: Video must be visible and behind the canvas */
        #input_video { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            object-fit: cover; 
            transform: scaleX(-1); /* Mirror the webcam */
            z-index: 0;
        }
        canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 1; /* Canvas sits on top of video */
        }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #00ffcc; font-family: 'Courier New', monospace;
            font-size: 14px; text-shadow: 0 0 5px #00ffcc;
            pointer-events: none; z-index: 2;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        BIO_SYNC: <span style="color:#0f0">CONNECTED</span><br>
        MODE: <span id="mode">IDLE</span><br>
        VOXELS: <span id="count">0</span> / 2000
    </div>
    
    <video id="input_video" playsinline></video>
    
    <script>
        // --- CONFIGURATION ---
        const MAX_VOXELS = 2000;
        const GRID_SIZE = 0.8; // Size of blocks
        const SMOOTHING = 0.2; // 0.1 = lazy, 0.9 = snappy
        
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        // Camera matches typical webcam FOV roughly
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- THE VOXEL ENGINE (InstancedMesh) ---
        // This is the secret to high performance on mobile.
        // We draw ONE geometry 2000 times.
        const geometry = new THREE.BoxGeometry(GRID_SIZE, GRID_SIZE, GRID_SIZE);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, 
            wireframe: true,
            transparent: true, 
            opacity: 0.6,
            blending: THREE.AdditiveBlending // THE "GLOW" EFFECT
        });
        
        const voxels = new THREE.InstancedMesh(geometry, material, MAX_VOXELS);
        // Initialize all instances off-screen (hidden)
        const dummy = new THREE.Object3D();
        for (let i = 0; i < MAX_VOXELS; i++) {
            dummy.position.set(0, 0, 1000); 
            dummy.updateMatrix();
            voxels.setMatrixAt(i, dummy.matrix);
        }
        voxels.instanceMatrix.needsUpdate = true;
        scene.add(voxels);

        // The "Cursor" (Shows where you are pointing)
        const cursorGeo = new THREE.BoxGeometry(GRID_SIZE * 1.2, GRID_SIZE * 1.2, GRID_SIZE * 1.2);
        const cursorMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
        const cursor = new THREE.Mesh(cursorGeo, cursorMat);
        scene.add(cursor);

        // --- STATE VARIABLES ---
        let voxelCount = 0;
        let isPinching = false;
        let lastGridPos = { x: null, y: null, z: null };
        let handPos = { x: 0, y: 0, z: 0 }; // Raw target
        let smoothedPos = { x: 0, y: 0, z: 0 }; // Lerped position

        // --- MEDIAPIPE LOGIC ---
        const videoElement = document.getElementById('input_video');
        const modeLabel = document.getElementById('mode');
        const countLabel = document.getElementById('count');

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                const wrist = landmarks[0];

                // 1. PINCH DETECTION
                const distance = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                const threshold = 0.06; // Sensitivity
                
                isPinching = distance < threshold;
                
                // 2. MAPPING COORDINATES
                // Map 0-1 video coords to approx -10 to +10 world coords
                const aspect = window.innerWidth / window.innerHeight;
                const rangeX = 20 * aspect;
                const rangeY = 20;
                
                // Flip X because webcam is mirrored
                handPos.x = (1 - indexTip.x) * rangeX - (rangeX / 2);
                handPos.y = (1 - indexTip.y) * rangeY - (rangeY / 2);
                
                // Depth estimation based on hand size (wrist to middle finger mcp)
                // Just a rough guess: closer hand = bigger distance between points
                // For now, let's keep Z fixed at 0 for easier drawing on a 2D plane
                handPos.z = 0; 
                
                // UPDATE UI
                if (isPinching) {
                    modeLabel.innerText = "DRAWING";
                    modeLabel.style.color = "#00ffff";
                    cursor.material.color.setHex(0x00ffff);
                } else {
                    modeLabel.innerText = "HOVER";
                    modeLabel.style.color = "#aaaaaa";
                    cursor.material.color.setHex(0xff0055);
                    // Reset grid lock so we can draw in the same spot again if we want
                    lastGridPos = { x: null, y: null, z: null };
                }
            }
        }

        // --- MAIN LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. SMOOTHING (LERP)
            smoothedPos.x += (handPos.x - smoothedPos.x) * SMOOTHING;
            smoothedPos.y += (handPos.y - smoothedPos.y) * SMOOTHING;
            smoothedPos.z += (handPos.z - smoothedPos.z) * SMOOTHING;

            // Update Cursor
            cursor.position.set(smoothedPos.x, smoothedPos.y, smoothedPos.z);
            cursor.rotation.x += 0.02;
            cursor.rotation.y += 0.02;

            // 2. VOXEL PLACEMENT LOGIC
            if (isPinching && voxelCount < MAX_VOXELS) {
                // Snap to Grid
                const snapX = Math.round(smoothedPos.x / GRID_SIZE) * GRID_SIZE;
                const snapY = Math.round(smoothedPos.y / GRID_SIZE) * GRID_SIZE;
                const snapZ = 0; // Keep flat for now

                // Check if we already placed a block here recently
                if (snapX !== lastGridPos.x || snapY !== lastGridPos.y) {
                    
                    // PLACE BLOCK
                    dummy.position.set(snapX, snapY, snapZ);
                    dummy.scale.set(1, 1, 1);
                    dummy.updateMatrix();
                    
                    voxels.setMatrixAt(voxelCount, dummy.matrix);
                    voxels.instanceMatrix.needsUpdate = true;
                    
                    voxelCount++;
                    countLabel.innerText = voxelCount;
                    
                    // Update Memory
                    lastGridPos = { x: snapX, y: snapY, z: snapZ };
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        // --- INITIALIZATION ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, // 0 = FAST (Mobile Optimized), 1 = ACCURATE
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        cameraUtils.start();
    </script>
</body>
</html>
