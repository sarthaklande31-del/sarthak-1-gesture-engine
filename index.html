<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IRON MAN MK.85 FLAWLESS</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }

        /* LAYERS */
        #input_video { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; transform: scaleX(-1); opacity: 0.3; z-index: 0;
        }
        #output_canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            transform: scaleX(-1); z-index: 1; pointer-events: none;
        }
        #three_canvas { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: 2; pointer-events: none;
        }

        /* START BUTTON */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        #start-btn {
            padding: 15px 40px; border: 2px solid #00ffff; background: rgba(0, 255, 255, 0.1);
            color: #00ffff; font-size: 18px; font-family: 'Courier New'; cursor: pointer;
            text-transform: uppercase; letter-spacing: 3px; box-shadow: 0 0 20px #00ffff;
            transition: 0.3s;
        }
        #start-btn:hover { background: #00ffff; color: #000; }

        /* HUD */
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            color: #00ffff; font-weight: bold; pointer-events: none; display: none;
            background: rgba(0,0,0,0.5); padding: 10px; border-left: 3px solid #00ffff;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1 style="color:white; font-size: 14px; margin-bottom: 20px;">STARK INDUSTRIES // MARK 85</h1>
        <button id="start-btn" onclick="startSystem()">INITIALIZE SYSTEM</button>
    </div>

    <div id="ui">
        STATUS: <span style="color:#0f0">ONLINE</span><br>
        VOXELS: <span id="count">0</span><br>
        <div style="font-size:10px; color:#aaa; margin-top:5px;">
        [R] PINCH: DRAW<br>
        [L] MOVE: ROTATE 360<br>
        [L] PINCH: ERASE<br>
        [L] FIST: RESET
        </div>
    </div>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        // --- CONFIG ---
        const CONFIG = {
            gridSize: 0.8,
            smoothing: 0.1, // Super Stable
            pinchThreshold: 0.05,
            maxBlocks: 1500
        };

        // --- THREE.JS ---
        const scene = new THREE.Scene();
        const world = new THREE.Group(); 
        scene.add(world);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 16;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.id = "three_canvas";
        document.body.appendChild(renderer.domElement);

        // --- MATERIALS ---
        const blockGeo = new THREE.BoxGeometry(CONFIG.gridSize, CONFIG.gridSize, CONFIG.gridSize);
        // "Hologram" Blue
        const blockMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
        const wireMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, opacity: 0.4, transparent: true });

        const meshSolid = new THREE.InstancedMesh(blockGeo, blockMat, CONFIG.maxBlocks);
        const meshWire = new THREE.InstancedMesh(blockGeo, wireMat, CONFIG.maxBlocks);
        world.add(meshSolid);
        world.add(meshWire);

        // Cursor (Ghost)
        const cursor = new THREE.Mesh(blockGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, opacity: 0.3, transparent: true }));
        scene.add(cursor);

        // The "Loading" Circle (Right Hand Pinch)
        const ringGeo = new THREE.RingGeometry(0.6, 0.7, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true });
        const loadingRing = new THREE.Mesh(ringGeo, ringMat);
        scene.add(loadingRing);
        loadingRing.visible = false;

        // Eraser (Red)
        const eraser = new THREE.Mesh(blockGeo, new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true }));
        scene.add(eraser);
        eraser.visible = false;

        // --- STATE ---
        const dummy = new THREE.Object3D();
        const voxelMap = new Map();
        let voxelCount = 0;
        let smoothHand = {x:0, y:0};
        let lastLeftPalm = {x:null, y:null};

        function clearAll() {
            for(let i=0; i<CONFIG.maxBlocks; i++){
                dummy.position.set(0,0,1000); dummy.updateMatrix();
                meshSolid.setMatrixAt(i, dummy.matrix);
                meshWire.setMatrixAt(i, dummy.matrix);
            }
            meshSolid.instanceMatrix.needsUpdate = true;
            meshWire.instanceMatrix.needsUpdate = true;
            voxelMap.clear();
            voxelCount = 0;
            world.rotation.set(0,0,0);
            document.getElementById('count').innerText = 0;
        }
        clearAll();

        function lerp(start, end, amt) { return (1-amt)*start + amt*end; }

        // --- HAND TRACKING ---
        const canvas2D = document.getElementById('output_canvas');
        const ctx2D = canvas2D.getContext('2d');
        canvas2D.width = window.innerWidth;
        canvas2D.height = window.innerHeight;

        function onResults(results) {
            // 1. DRAW TECH SKELETON (Cyan/Green)
            ctx2D.save();
            ctx2D.clearRect(0, 0, canvas2D.width, canvas2D.height);
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(ctx2D, landmarks, HAND_CONNECTIONS, {color: '#00ffff', lineWidth: 2}); // Bones
                    drawLandmarks(ctx2D, landmarks, {color: '#ffffff', lineWidth: 1, radius: 2}); // Joints
                }
            }
            ctx2D.restore();

            cursor.visible = false;
            loadingRing.visible = false;
            eraser.visible = false;

            if (results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const label = results.multiHandedness[index].label;

                    // === RIGHT HAND (BUILDER) ===
                    if (label === "Left") {
                        const tip = landmarks[8];
                        const thumb = landmarks[4];
                        const pinch = Math.hypot(tip.x - thumb.x, tip.y - thumb.y) < CONFIG.pinchThreshold;

                        // Coords
                        const x = (1 - tip.x) * 24 - 12;
                        const y = (1 - tip.y) * 18 - 9;
                        
                        // Stabilize Movement
                        smoothHand.x = lerp(smoothHand.x, x, CONFIG.smoothing);
                        smoothHand.y = lerp(smoothHand.y, y, CONFIG.smoothing);

                        cursor.visible = true;
                        cursor.position.set(smoothHand.x, smoothHand.y, 0);

                        // ACTION: PINCH (DRAW)
                        if (pinch) {
                            // Show Loading Ring
                            loadingRing.visible = true;
                            loadingRing.position.set(smoothHand.x, smoothHand.y, 0);
                            loadingRing.rotation.z -= 0.2; // Spin

                            // Solidify Cursor
                            cursor.material.color.setHex(0x00ffff);
                            cursor.material.wireframe = false;

                            // Place Block
                            const sx = Math.round(smoothHand.x / CONFIG.gridSize) * CONFIG.gridSize;
                            const sy = Math.round(smoothHand.y / CONFIG.gridSize) * CONFIG.gridSize;
                            const key = `${sx},${sy}`;

                            if (!voxelMap.has(key) && voxelCount < CONFIG.maxBlocks) {
                                dummy.position.set(sx, sy, 0);
                                dummy.updateMatrix();
                                meshSolid.setMatrixAt(voxelCount, dummy.matrix);
                                meshWire.setMatrixAt(voxelCount, dummy.matrix);
                                meshSolid.instanceMatrix.needsUpdate = true;
                                meshWire.instanceMatrix.needsUpdate = true;
                                voxelMap.set(key, voxelCount);
                                voxelCount++;
                                document.getElementById('count').innerText = voxelCount;
                            }
                        } else {
                            cursor.material.color.setHex(0xffffff);
                            cursor.material.wireframe = true;
                        }
                    }

                    // === LEFT HAND (CONTROLLER) ===
                    if (label === "Right") {
                        const tip = landmarks[8];
                        const thumb = landmarks[4];
                        const pinch = Math.hypot(tip.x - thumb.x, tip.y - thumb.y) < CONFIG.pinchThreshold;
                        
                        // Fist Check (Reset)
                        const isFist = landmarks[12].y > landmarks[9].y && landmarks[16].y > landmarks[13].y;

                        // ACTION 1: RESET (FIST)
                        if (isFist) {
                            loadingRing.visible = true;
                            loadingRing.position.set((1-landmarks[9].x)*24-12, (1-landmarks[9].y)*18-9, 0);
                            loadingRing.material.color.setHex(0xff0000); // Red
                            clearAll();
                        }
                        // ACTION 2: ERASE (PINCH)
                        else if (pinch) {
                            eraser.visible = true;
                            const ex = (1 - tip.x) * 24 - 12;
                            const ey = (1 - tip.y) * 18 - 9;
                            eraser.position.set(ex, ey, 0);
                            
                            const sx = Math.round(ex / CONFIG.gridSize) * CONFIG.gridSize;
                            const sy = Math.round(ey / CONFIG.gridSize) * CONFIG.gridSize;
                            const key = `${sx},${sy}`;
                            
                            if(voxelMap.has(key)) {
                                const idx = voxelMap.get(key);
                                dummy.position.set(0,0,1000); dummy.updateMatrix();
                                meshSolid.setMatrixAt(idx, dummy.matrix);
                                meshWire.setMatrixAt(idx, dummy.matrix);
                                meshSolid.instanceMatrix.needsUpdate = true;
                                meshWire.instanceMatrix.needsUpdate = true;
                                voxelMap.delete(key);
                            }
                        }
                        // ACTION 3: ROTATE 360 (OPEN PALM MOVE)
                        else {
                            // Map Hand X Movement to Rotation Y
                            const currentX = landmarks[9].x; // Middle knuckle
                            if (lastLeftPalm.x !== null) {
                                const deltaX = currentX - lastLeftPalm.x;
                                world.rotation.y += deltaX * 4; // Sensitivity
                            }
                            lastLeftPalm.x = currentX;
                        }
                    } else {
                        // Reset Palm Tracking if hand lost
                        if(index === 1) lastLeftPalm.x = null; 
                    }
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        function startSystem() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui').style.display = 'block';

            const videoElement = document.getElementById('input_video');
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            
            hands.setOptions({ 
                maxNumHands: 2, 
                modelComplexity: 1, 
                minDetectionConfidence: 0.5, 
                minTrackingConfidence: 0.5 
            });
            hands.onResults(onResults);

            const cam = new Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 1280, height: 720
            });
            cam.start();
        }
    </script>
</body>
</html>
