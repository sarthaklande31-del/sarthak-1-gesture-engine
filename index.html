<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JARVIS HUD V6</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }

        /* 1. CAMERA FEED */
        #input_video { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; transform: scaleX(-1); opacity: 0.6; z-index: 0;
        }

        /* 2. UI OVERLAY */
        #hud {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            color: #00ffff; pointer-events: none; font-weight: bold;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
            border: 1px solid #00ffff;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        SYSTEM: <span style="color:#0f0">ONLINE</span><br>
        VOXELS: <span id="count">0</span><br>
        <span style="font-size: 10px; color: #aaa;">
        [R] PINCH: DRAW<br>
        [L] PINCH: ERASE<br>
        [L] FIST: RESET<br>
        [L] PALM: ROTATE
        </span>
    </div>

    <video id="input_video" autoplay muted playsinline></video>

    <script>
        // --- 1. SETTINGS ---
        const CONFIG = {
            gridSize: 0.8,
            smoothing: 0.15, // 0.1 = Robotic/Stable, 0.4 = Fast
            pinchThreshold: 0.05,
            maxBlocks: 1500
        };

        // --- 2. 3D WORLD SETUP ---
        const scene = new THREE.Scene();
        const world = new THREE.Group(); 
        scene.add(world); // We rotate this group, not the camera

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 3. MATERIALS & OBJECTS ---
        
        // A. THE BLOCKS (Blue Hologram)
        const blockGeo = new THREE.BoxGeometry(CONFIG.gridSize, CONFIG.gridSize, CONFIG.gridSize);
        const blockMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending 
        });
        const blockWire = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, opacity: 0.3, transparent: true });

        // Optimized Rendering (InstancedMesh)
        const meshSolid = new THREE.InstancedMesh(blockGeo, blockMat, CONFIG.maxBlocks);
        const meshWire = new THREE.InstancedMesh(blockGeo, blockWire, CONFIG.maxBlocks);
        world.add(meshSolid);
        world.add(meshWire);

        // B. CURSORS
        // Builder Cursor (Right Hand)
        const cursorMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.5 });
        const cursor = new THREE.Mesh(blockGeo, cursorMat);
        scene.add(cursor); // Separate from world so it doesn't rotate with blocks

        // Eraser Cursor (Left Hand)
        const eraserMat = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true, transparent: true, opacity: 0.8 });
        const eraser = new THREE.Mesh(blockGeo, eraserMat);
        scene.add(eraser);
        eraser.visible = false;

        // Init Storage
        const dummy = new THREE.Object3D();
        const voxelMap = new Map(); // Key: "x,y", Value: Index
        let voxelCount = 0;

        // Clear Function
        function clearWorld() {
            for(let i=0; i<CONFIG.maxBlocks; i++){
                dummy.position.set(0,0,1000); // Move away
                dummy.updateMatrix();
                meshSolid.setMatrixAt(i, dummy.matrix);
                meshWire.setMatrixAt(i, dummy.matrix);
            }
            meshSolid.instanceMatrix.needsUpdate = true;
            meshWire.instanceMatrix.needsUpdate = true;
            voxelMap.clear();
            voxelCount = 0;
            document.getElementById('count').innerText = "0";
            world.rotation.set(0,0,0); // Reset Rotation
        }
        clearWorld(); // Run once at start

        // --- 4. STABILIZATION VARIABLES ---
        let smoothRight = { x: 0, y: 0 }; 
        let targetRight = { x: 0, y: 0 };
        let smoothLeft = { x: 0, y: 0 };
        
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        // --- 5. HAND TRACKING LOGIC ---
        function onResults(results) {
            cursor.visible = false;
            eraser.visible = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const label = results.multiHandedness[index].label; 
                    
                    // ---------------------------------------------------------
                    // RIGHT HAND (BUILDER) -> MediaPipe Label "Left"
                    // ---------------------------------------------------------
                    if (label === "Left") { 
                        cursor.visible = true;
                        const indexTip = landmarks[8];
                        const thumbTip = landmarks[4];
                        
                        // Distance (Pinch)
                        const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                        const isPinching = dist < CONFIG.pinchThreshold;

                        // Coordinates (Map 0..1 to -12..12)
                        const x = (1 - indexTip.x) * 24 - 12;
                        const y = (1 - indexTip.y) * 18 - 9;
                        
                        // Stabilize
                        targetRight.x = x; targetRight.y = y;
                        smoothRight.x = lerp(smoothRight.x, targetRight.x, CONFIG.smoothing);
                        smoothRight.y = lerp(smoothRight.y, targetRight.y, CONFIG.smoothing);

                        cursor.position.set(smoothRight.x, smoothRight.y, 0);

                        // DRAW LOGIC
                        if (isPinching) {
                            cursor.material.color.setHex(0x00ffff); // Blue
                            cursor.material.wireframe = false;
                            
                            // Snap to Grid
                            const snapX = Math.round(smoothRight.x / CONFIG.gridSize) * CONFIG.gridSize;
                            const snapY = Math.round(smoothRight.y / CONFIG.gridSize) * CONFIG.gridSize;
                            const key = `${snapX},${snapY}`;

                            // Place Block
                            if (!voxelMap.has(key) && voxelCount < CONFIG.maxBlocks) {
                                dummy.position.set(snapX, snapY, 0);
                                dummy.updateMatrix();
                                meshSolid.setMatrixAt(voxelCount, dummy.matrix);
                                meshWire.setMatrixAt(voxelCount, dummy.matrix);
                                meshSolid.instanceMatrix.needsUpdate = true;
                                meshWire.instanceMatrix.needsUpdate = true;
                                
                                voxelMap.set(key, voxelCount);
                                voxelCount++;
                                document.getElementById('count').innerText = voxelCount;
                            }
                        } else {
                            cursor.material.color.setHex(0xffffff); // White
                            cursor.material.wireframe = true;
                        }
                    }

                    // ---------------------------------------------------------
                    // LEFT HAND (TOOLS) -> MediaPipe Label "Right"
                    // ---------------------------------------------------------
                    if (label === "Right") {
                        const thumb = landmarks[4];
                        const indexF = landmarks[8];
                        const wrist = landmarks[0];
                        
                        // 1. FIST CHECK (RESET)
                        // Are fingers curled? (Tip below knuckle)
                        const isFist = landmarks[12].y > landmarks[9].y && landmarks[16].y > landmarks[13].y;
                        
                        if (isFist) {
                            // SHOW RESET FEEDBACK (Red Flash on HUD maybe?)
                            clearWorld();
                        } 
                        else {
                            // 2. PINCH CHECK (ERASER)
                            const dist = Math.hypot(indexF.x - thumb.x, indexF.y - thumb.y);
                            
                            if (dist < CONFIG.pinchThreshold) {
                                eraser.visible = true;
                                
                                const x = (1 - indexF.x) * 24 - 12;
                                const y = (1 - indexF.y) * 18 - 9;
                                
                                smoothLeft.x = lerp(smoothLeft.x, x, CONFIG.smoothing);
                                smoothLeft.y = lerp(smoothLeft.y, y, CONFIG.smoothing);
                                eraser.position.set(smoothLeft.x, smoothLeft.y, 0);

                                // Check Collision with Blocks
                                const hitX = Math.round(smoothLeft.x / CONFIG.gridSize) * CONFIG.gridSize;
                                const hitY = Math.round(smoothLeft.y / CONFIG.gridSize) * CONFIG.gridSize;
                                const key = `${hitX},${hitY}`;

                                if (voxelMap.has(key)) {
                                    const idx = voxelMap.get(key);
                                    // Delete by moving far away
                                    dummy.position.set(0,0,1000);
                                    dummy.updateMatrix();
                                    meshSolid.setMatrixAt(idx, dummy.matrix);
                                    meshWire.setMatrixAt(idx, dummy.matrix);
                                    meshSolid.instanceMatrix.needsUpdate = true;
                                    meshWire.instanceMatrix.needsUpdate = true;
                                    voxelMap.delete(key);
                                }
                            } 
                            // 3. PALM OPEN (ROTATE)
                            else {
                                // Rotate world based on hand position
                                const rotX = (landmarks[9].x - 0.5) * 2.5; 
                                world.rotation.y = rotX;
                            }
                        }
                    }
                });
            }
        }

        // --- 6. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            // Idle Animations
            if(cursor.visible) { cursor.rotation.x += 0.02; cursor.rotation.y += 0.02; }
            if(eraser.visible) { eraser.rotation.z -= 0.1; }
            renderer.render(scene, camera);
        }
        animate();

        // --- 7. CAMERA START (Auto-Detect) ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        
        hands.setOptions({ 
            maxNumHands: 2, 
            modelComplexity: 0, // Lite mode for mobile speed
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5 
        });
        
        hands.onResults(onResults);

        const videoElement = document.getElementById('input_video');
        const cam = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        cam.start();

    </script>
</body>
</html>
