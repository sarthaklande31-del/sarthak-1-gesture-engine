<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sarthak 1.0 – Gesture Intelligence Engine</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>

<body>

<!-- CAMERA PREVIEW -->
<video id="preview" autoplay muted playsinline
  style="
    position: fixed;
    bottom: 10px;
    right: 10px;
    width: 120px;
    border: 2px solid #ff7a18;
    z-index: 10;
  ">
</video>

<!-- DEBUG TEXT -->
<div id="debug"
  style="
    position: fixed;
    top: 10px;
    left: 10px;
    color: #ff7a18;
    font-family: monospace;
    z-index: 10;
  ">
Loading…
</div>

<script>
/* ===============================
   1. STATE
================================ */
const State = {
  expansion: 1.0,
  shape: "SPHERE"
};

/* ===============================
   2. THREE.JS SCENE
================================ */
const scene = new THREE.Scene();

const camera3D = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera3D.position.z = 5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* ===============================
   3. PARTICLES
================================ */
const COUNT = 20000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(COUNT * 3);
const targets = new Float32Array(COUNT * 3);

for (let i = 0; i < COUNT * 3; i++) {
  positions[i] = (Math.random() - 0.5) * 2;
  targets[i] = positions[i];
}

geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

const material = new THREE.PointsMaterial({
  size: 0.03,
  color: 0xff7a18,
  transparent: true
});

const particles = new THREE.Points(geometry, material);
scene.add(particles);

/* ===============================
   4. SHAPES
================================ */
function sphereTemplate() {
  const a = Math.random() * Math.PI * 2;
  const b = Math.random() * Math.PI;
  return {
    x: Math.sin(b) * Math.cos(a),
    y: Math.sin(b) * Math.sin(a),
    z: Math.cos(b)
  };
}

function heartTemplate(i, total) {
  const t = (i / total) * Math.PI * 2;
  return {
    x: 0.03 * 16 * Math.pow(Math.sin(t), 3),
    y: 0.03 * (
      13 * Math.cos(t) -
      5 * Math.cos(2 * t) -
      2 * Math.cos(3 * t) -
      Math.cos(4 * t)
    ),
    z: 0
  };
}

function saturnTemplate() {
  const a = Math.random() * Math.PI * 2;
  const r = 1 + Math.random() * 0.4;
  return {
    x: Math.cos(a) * r,
    y: (Math.random() - 0.5) * 0.2,
    z: Math.sin(a) * r
  };
}

/* ===============================
   5. APPLY SHAPE
================================ */
function applyTemplate(type) {
  for (let i = 0; i < COUNT; i++) {
    let p;
    if (type === "HEART") p = heartTemplate(i, COUNT);
    else if (type === "SATURN") p = saturnTemplate();
    else p = sphereTemplate();

    targets[i * 3]     = p.x * State.expansion;
    targets[i * 3 + 1] = p.y * State.expansion;
    targets[i * 3 + 2] = p.z * State.expansion;
  }
}

applyTemplate("SPHERE");

/* ===============================
   6. HAND TRACKING
================================ */
const video = document.getElementById("preview");
const debug = document.getElementById("debug");

const hands = new Hands({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults(results => {
  if (!results.multiHandLandmarks.length) {
    debug.innerText = "No hand detected";
    return;
  }

  const hand = results.multiHandLandmarks[0];
  const thumb = hand[4];
  const index = hand[8];

  const pinch = Math.hypot(
    thumb.x - index.x,
    thumb.y - index.y
  );

  // Expansion (very obvious)
  State.expansion = THREE.MathUtils.clamp(
    2.5 - hand[0].y * 3,
    0.5,
    3.5
  );

  if (pinch < 0.045) {
    material.color.set(0xff2d55);
    applyTemplate("HEART");
    debug.innerText = "PINCH → HEART";
  }
  else if (pinch > 0.12) {
    material.color.set(0xff7a18);
    applyTemplate("SATURN");
    debug.innerText = "OPEN → SATURN";
  }
  else {
    debug.innerText = "Hand detected";
  }
});

const cam = new Camera(video, {
  onFrame: async () => {
    await hands.send({ image: video });
  },
  width: 640,
  height: 480
});
cam.start();

/* ===============================
   7. ANIMATION LOOP
================================ */
function animate() {
  requestAnimationFrame(animate);

  for (let i = 0; i < positions.length; i++) {
    positions[i] += (targets[i] - positions[i]) * 0.08;
  }

  geometry.attributes.position.needsUpdate = true;
  renderer.render(scene, camera3D);
}

animate();
</script>

</body>
</html>
