<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JARVIS_INTERFACE_V1</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        
        /* 1. MAKE VIDEO VISIBLE & MIRRORED */
        #input_video { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            object-fit: cover; 
            transform: scaleX(-1); 
            z-index: 0;
        }
        
        /* 2. CANVAS ON TOP */
        canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 1; 
        }

        /* 3. HUD TEXT */
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: #00ffff; font-family: 'Courier New', monospace;
            font-weight: bold; font-size: 14px; 
            text-shadow: 0 0 5px #00ffff;
            pointer-events: none; z-index: 2;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px; border: 1px solid #00ffff;
        }
        
        .red { color: #ff0055; text-shadow: 0 0 5px #ff0055; }
        .green { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        SYSTEM: <span class="green">ONLINE</span><br>
        MODE: <span id="mode_text">SCANNING</span><br>
        BLOCKS: <span id="block_count">0</span> / 1500<br>
        <br>
        [CONTROLS]<br>
        PINCH RIGHT: <span style="color:white">DRAW</span><br>
        OPEN PALM: <span style="color:white">ROTATE</span><br>
        LEFT FIST: <span class="red">RESET</span>
    </div>

    <video id="input_video" playsinline></video>

    <script>
        // --- CONFIG ---
        const GRID_SIZE = 0.6; // Size of the blocks
        const MAX_BLOCKS = 1500;
        
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 12; // Zoom level

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- INSTANCED MESH (HIGH PERFORMANCE) ---
        // This allows us to draw 1500 blocks without lag
        const geometry = new THREE.BoxGeometry(GRID_SIZE, GRID_SIZE, GRID_SIZE);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, 
            wireframe: true, // WIREFRAME LOOK
            transparent: true, 
            opacity: 0.5 
        });
        
        const blocks = new THREE.InstancedMesh(geometry, material, MAX_BLOCKS);
        scene.add(blocks);

        // Hide all blocks initially
        const dummy = new THREE.Object3D();
        for(let i=0; i<MAX_BLOCKS; i++){
            dummy.position.set(0, 0, 1000); // Move off-screen
            dummy.updateMatrix();
            blocks.setMatrixAt(i, dummy.matrix);
        }
        blocks.instanceMatrix.needsUpdate = true;

        // --- CURSOR (The "Brush") ---
        const cursorGeo = new THREE.BoxGeometry(GRID_SIZE*1.1, GRID_SIZE*1.1, GRID_SIZE*1.1);
        const cursorMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
        const cursor = new THREE.Mesh(cursorGeo, cursorMat);
        scene.add(cursor);

        // --- STATE VARIABLES ---
        let count = 0;
        let isDrawing = false;
        let isRotating = false;
        let lastPos = {x:0, y:0, z:0};
        let sceneRotation = {x:0, y:0};

        // --- HAND TRACKING LOGIC ---
        const videoElement = document.getElementById('input_video');
        const modeText = document.getElementById('mode_text');
        const countText = document.getElementById('block_count');

        function onResults(results) {
            // Reset state if no hands
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                modeText.innerText = "SCANNING";
                modeText.className = "";
                return;
            }

            // Loop through detected hands
            for (const [index, landmarks] of results.multiHandLandmarks.entries()) {
                const handedness = results.multiHandedness[index].label; // "Left" or "Right"

                // 1. CALCULATE FINGERS (Simple logic)
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                const middleTip = landmarks[12];
                const wrist = landmarks[0];

                // Pinch Distance (Thumb to Index)
                const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                
                // Palm Open Check (Middle finger is far from wrist)
                const isPalmOpen = (wrist.y - middleTip.y) > 0.2; 
                
                // Fist Check (Fingers curled)
                const isFist = (wrist.y - middleTip.y) < 0.1;

                // --- LOGIC MAP ---
                
                // ACTION 1: LEFT HAND FIST -> RESET
                if (handedness === "Right" && isFist) { // MediaPipe mirrors handedness label often
                     // Actually, let's just use "If any fist is held"
                     if(pinchDist < 0.1 && (wrist.y - landmarks[12].y) < 0.1) {
                        modeText.innerText = "RESETTING...";
                        modeText.className = "red";
                        count = 0; // Reset counter
                        // Clear blocks
                        for(let i=0; i<MAX_BLOCKS; i++){
                            dummy.position.set(0, 0, 1000);
                            dummy.updateMatrix();
                            blocks.setMatrixAt(i, dummy.matrix);
                        }
                        blocks.instanceMatrix.needsUpdate = true;
                        countText.innerText = 0;
                        return;
                     }
                }

                // ACTION 2: RIGHT HAND -> DRAW or ROTATE
                if (handedness === "Left") { // Again, label is often mirrored
                    
                    // Map Coordinates to 3D Space
                    const x = (1 - indexTip.x) * 20 - 10; // Map 0..1 to -10..10
                    const y = (1 - indexTip.y) * 15 - 7.5;
                    
                    // Move Cursor
                    cursor.position.set(x, y, 0);

                    // ROTATION MODE (Open Palm)
                    if (pinchDist > 0.15) { 
                        modeText.innerText = "ROTATING";
                        modeText.className = "green";
                        
                        // Map hand X position to Scene Rotation Y
                        blocks.rotation.y = (x * 0.1); 
                        blocks.rotation.x = -(y * 0.1);
                    }
                    
                    // DRAW MODE (Pinch)
                    else if (pinchDist < 0.05) {
                        modeText.innerText = "DRAWING";
                        modeText.className = "green";
                        
                        // SNAP TO GRID
                        const snapX = Math.round(x / GRID_SIZE) * GRID_SIZE;
                        const snapY = Math.round(y / GRID_SIZE) * GRID_SIZE;
                        
                        // Only draw if we moved to a new spot
                        if ((snapX !== lastPos.x || snapY !== lastPos.y) && count < MAX_BLOCKS) {
                            dummy.position.set(snapX, snapY, 0);
                            dummy.rotation.set(0,0,0); // Blocks don't rotate, the scene does
                            dummy.updateMatrix();
                            
                            // Add to list relative to current scene rotation is tricky
                            // Simple hack: We just place it in the static container and rotate the container
                            // But for "Drawing in 3D" while rotating, we need more math.
                            // For this replica: We draw on 2D plane, then rotate the whole thing.
                            
                            blocks.setMatrixAt(count, dummy.matrix);
                            blocks.instanceMatrix.needsUpdate = true;
                            
                            lastPos = {x: snapX, y: snapY};
                            count++;
                            countText.innerText = count;
                        }
                    } 
                    else {
                        modeText.innerText = "HOVER";
                        modeText.className = "";
                    }
                }
            }
        }

        // --- SETUP MEDIAPIPE ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 2, // Track both hands
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        cameraUtils.start();

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
        
    </script>
</body>
</html>
