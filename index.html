<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEXUS ARCHITECT V2</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        
        /* LAYER 1: The Camera Feed */
        #input_video { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            object-fit: cover; 
            transform: scaleX(-1); /* Mirror effect */
            z-index: 0;
        }

        /* LAYER 2: The 2D Skeleton Overlay (The Lines) */
        #output_canvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            transform: scaleX(-1); /* Mirror to match video */
        }

        /* LAYER 3: The 3D Block World */
        #three_canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 2; 
        }

        /* LAYER 4: The HUD */
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: #00ffff; font-family: 'Courier New', monospace;
            font-weight: bold; font-size: 14px; 
            text-shadow: 0 0 5px #00ffff;
            pointer-events: none; z-index: 3;
            background: rgba(0, 20, 40, 0.7);
            padding: 15px; border: 1px solid #00ffff;
            border-radius: 5px;
        }
        
        .mode-draw { color: #00ff00; }
        .mode-erase { color: #ff0055; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        NEXUS_OS: <span style="color:white">V2.0_STABLE</span><br>
        RIGHT HAND: <span class="mode-draw">BUILDER</span><br>
        LEFT HAND: <span class="mode-erase">ERASER</span><br>
        VOXELS: <span id="voxel_count">0</span>
    </div>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas> <script>
        // --- 1. CONFIGURATION ---
        const CONFIG = {
            gridSize: 0.8,         // Block size
            smoothing: 0.15,       // Lower = Smoother (but slower), Higher = Snappy
            pinchThreshold: 0.06,  // Sensitivity of the click
            maxBlocks: 2000
        };

        // --- 2. SETUP VISUAL LAYERS ---
        const videoElement = document.getElementById('input_video');
        const canvas2D = document.getElementById('output_canvas');
        const ctx2D = canvas2D.getContext('2d');
        const voxelCountLabel = document.getElementById('voxel_count');

        // Fix Canvas Size
        canvas2D.width = window.innerWidth;
        canvas2D.height = window.innerHeight;

        // --- 3. THREE.JS ENGINE (The 3D World) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.id = "three_canvas";
        document.body.appendChild(renderer.domElement);

        // -- INSTANCED MESH (The Optimized Block System) --
        const geometry = new THREE.BoxGeometry(CONFIG.gridSize, CONFIG.gridSize, CONFIG.gridSize);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.6,
            blending: THREE.AdditiveBlending 
        });
        const voxels = new THREE.InstancedMesh(geometry, material, CONFIG.maxBlocks);
        scene.add(voxels);

        // Storage for block positions (to check for erasing later)
        const voxelData = []; 
        const dummy = new THREE.Object3D();
        
        // Initialize Blocks off-screen
        for(let i=0; i<CONFIG.maxBlocks; i++){
            dummy.position.set(0,0,1000);
            dummy.updateMatrix();
            voxels.setMatrixAt(i, dummy.matrix);
            voxelData.push({ active: false, x: 0, y: 0 });
        }
        voxels.instanceMatrix.needsUpdate = true;

        // -- CURSORS --
        // Builder Cursor (Green/Cyan)
        const cursorGeo = new THREE.BoxGeometry(CONFIG.gridSize*1.1, CONFIG.gridSize*1.1, CONFIG.gridSize*1.1);
        const cursorMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const cursor = new THREE.Mesh(cursorGeo, cursorMat);
        scene.add(cursor);

        // Eraser Cursor (Red)
        const eraserMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
        const eraser = new THREE.Mesh(cursorGeo, eraserMat);
        scene.add(eraser);

        // --- 4. THE STABILIZER (Math) ---
        let smoothHand = { x: 0, y: 0 }; // Right hand smoothed
        let smoothErase = { x: 0, y: 0 }; // Left hand smoothed
        let currentVoxelIndex = 0;

        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        // --- 5. CORE LOGIC ---
        function onResults(results) {
            // A. DRAW SKELETON ON 2D CANVAS
            ctx2D.save();
            ctx2D.clearRect(0, 0, canvas2D.width, canvas2D.height);
            
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    // Draw connectors (bones)
                    drawConnectors(ctx2D, landmarks, HAND_CONNECTIONS,
                                 {color: '#00ffff', lineWidth: 2});
                    // Draw landmarks (joints)
                    drawLandmarks(ctx2D, landmarks, 
                                {color: '#ffffff', lineWidth: 1, radius: 2});
                }
            }
            ctx2D.restore();

            // B. HANDLE LOGIC
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const handedness = results.multiHandedness[index].label; // Left or Right
                    
                    // Get Fingertips
                    const indexTip = landmarks[8];
                    const thumbTip = landmarks[4];
                    
                    // Calculate Pinch Distance
                    const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                    const isPinching = pinchDist < CONFIG.pinchThreshold;

                    // Map 2D Screen to 3D World Coordinates
                    // (Adjust multipliers to calibrate field of view)
                    const rawX = (1 - indexTip.x) * 24 - 12; 
                    const rawY = (1 - indexTip.y) * 18 - 9;

                    // === RIGHT HAND (BUILDER) ===
                    if (handedness === "Left") { // Mirror Flip: Left means user's Right Hand
                        
                        // 1. Stabilize Movement
                        smoothHand.x = lerp(smoothHand.x, rawX, CONFIG.smoothing);
                        smoothHand.y = lerp(smoothHand.y, rawY, CONFIG.smoothing);
                        
                        // 2. Move Cursor
                        cursor.position.set(smoothHand.x, smoothHand.y, 0);
                        
                        // 3. Visual Feedback on Skeleton
                        if(isPinching) {
                            cursor.material.color.setHex(0x00ff00); // Green when drawing
                            cursor.scale.set(0.8, 0.8, 0.8); // Shrink slightly
                            
                            // 4. DRAW BLOCKS
                            const snapX = Math.round(smoothHand.x / CONFIG.gridSize) * CONFIG.gridSize;
                            const snapY = Math.round(smoothHand.y / CONFIG.gridSize) * CONFIG.gridSize;

                            // Prevent duplicate blocks in same spot
                            let spotTaken = false;
                            // (Simple check, can be optimized)
                            
                            if (!spotTaken && currentVoxelIndex < CONFIG.maxBlocks) {
                                dummy.position.set(snapX, snapY, 0);
                                dummy.scale.set(1,1,1);
                                dummy.updateMatrix();
                                voxels.setMatrixAt(currentVoxelIndex, dummy.matrix);
                                
                                // Save data
                                voxelData[currentVoxelIndex] = { active: true, x: snapX, y: snapY };
                                currentVoxelIndex++;
                                voxels.instanceMatrix.needsUpdate = true;
                                voxelCountLabel.innerText = currentVoxelIndex;
                            }

                        } else {
                            cursor.material.color.setHex(0x00ffff); // Cyan when idle
                            cursor.scale.set(1, 1, 1);
                        }
                    }

                    // === LEFT HAND (ERASER) ===
                    if (handedness === "Right") { // Mirror Flip: Right means user's Left Hand
                        
                        smoothErase.x = lerp(smoothErase.x, rawX, CONFIG.smoothing);
                        smoothErase.y = lerp(smoothErase.y, rawY, CONFIG.smoothing);
                        
                        eraser.position.set(smoothErase.x, smoothErase.y, 0);

                        if(isPinching) {
                            eraser.material.color.setHex(0xff0000); // Red glow
                            
                            // Check collisions with blocks
                            const hitRange = CONFIG.gridSize;
                            
                            for(let i=0; i<currentVoxelIndex; i++) {
                                if (voxelData[i].active) {
                                    const dx = Math.abs(voxelData[i].x - smoothErase.x);
                                    const dy = Math.abs(voxelData[i].y - smoothErase.y);
                                    
                                    if(dx < hitRange && dy < hitRange) {
                                        // DELETE BLOCK (Move it to infinity)
                                        dummy.position.set(0,0,1000);
                                        dummy.updateMatrix();
                                        voxels.setMatrixAt(i, dummy.matrix);
                                        voxelData[i].active = false;
                                        voxels.instanceMatrix.needsUpdate = true;
                                    }
                                }
                            }
                        } else {
                            eraser.material.color.setHex(0xff0055); // Pink when idle
                        }
                    }
                });
            }
        }

        // --- 6. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Idle Animations
            cursor.rotation.z += 0.05;
            eraser.rotation.z -= 0.05;
            
            renderer.render(scene, camera);
        }
        animate();

        // --- 7. INITIALIZE CAMERA ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6, // Higher confidence = Less jitter
            minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        cameraUtils.start();

    </script>
</body>
</html>
