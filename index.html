<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IRON MAN HUD V5</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }

        /* VIDEO LAYER */
        #input_video { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; transform: scaleX(-1); opacity: 0.6; z-index: 0;
        }

        /* HUD LAYER */
        #hud {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            color: #00ffff; pointer-events: none; font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
            background: rgba(0,0,0,0.3); padding: 10px; border-left: 2px solid #00ffff;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        JARVIS_OS: <span style="color:#0f0">CONNECTED</span><br>
        LEFT HAND: <span style="color:#00ffff">ARC REACTOR</span><br>
        RIGHT HAND: <span style="color:#00ffff">BUILDER</span>
    </div>

    <video id="input_video" playsinline></video>

    <script>
        // --- 1. CONFIGURATION ---
        const CONFIG = {
            gridSize: 0.8,
            smoothing: 0.15, 
            pinchThreshold: 0.05,
            maxBlocks: 1500
        };

        // --- 2. THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const world = new THREE.Group(); 
        scene.add(world);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 3. BUILDER MATERIALS (Right Hand) ---
        const blockGeo = new THREE.BoxGeometry(CONFIG.gridSize, CONFIG.gridSize, CONFIG.gridSize);
        const blockMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending 
        });
        const blockWire = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, opacity: 0.3, transparent: true });

        const meshSolid = new THREE.InstancedMesh(blockGeo, blockMat, CONFIG.maxBlocks);
        const meshWire = new THREE.InstancedMesh(blockGeo, blockWire, CONFIG.maxBlocks);
        world.add(meshSolid);
        world.add(meshWire);

        // --- 4. ARC REACTOR SETUP (Left Hand) ---
        // Inner Core
        const reactorGeo = new THREE.RingGeometry(0.8, 1.2, 32);
        const reactorMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        const reactor = new THREE.Mesh(reactorGeo, reactorMat);
        
        // Outer Ring
        const reactorOuterGeo = new THREE.RingGeometry(1.4, 1.5, 32);
        const reactorOuter = new THREE.Mesh(reactorOuterGeo, reactorMat);
        reactor.add(reactorOuter);
        scene.add(reactor); // Not in 'world' because it stays on hand
        reactor.visible = false;

        // Builder Cursor
        const cursorMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.4 });
        const cursor = new THREE.Mesh(blockGeo, cursorMat);
        scene.add(cursor); 
        cursor.visible = false;

        // Init Blocks (Hide them)
        const dummy = new THREE.Object3D();
        const voxelMap = new Map(); 
        
        function clearAllBlocks() {
            for(let i=0; i<CONFIG.maxBlocks; i++){
                dummy.position.set(0,0,1000);
                dummy.updateMatrix();
                meshSolid.setMatrixAt(i, dummy.matrix);
                meshWire.setMatrixAt(i, dummy.matrix);
            }
            meshSolid.instanceMatrix.needsUpdate = true;
            meshWire.instanceMatrix.needsUpdate = true;
            voxelMap.clear();
            voxelCount = 0;
        }
        clearAllBlocks();

        let voxelCount = 0;

        // --- 5. STABILIZATION VARIABLES ---
        let smoothHand = { x: 0, y: 0 }; 
        let targetHand = { x: 0, y: 0 };
        let smoothReactor = { x: 0, y: 0 };
        let targetReactor = { x: 0, y: 0 };

        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        // --- 6. MEDIAPIPE LOGIC ---
        function onResults(results) {
            // Hide cursors by default
            cursor.visible = false;
            reactor.visible = false;

            if (results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const label = results.multiHandedness[index].label; 
                    
                    // ===========================================
                    // RIGHT HAND (BUILDER) - Label "Left"
                    // ===========================================
                    if (label === "Left") { 
                        cursor.visible = true;
                        const indexTip = landmarks[8];
                        const thumbTip = landmarks[4];
                        
                        const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                        const isPinching = dist < CONFIG.pinchThreshold;

                        // Coordinate Map
                        const x = (1 - indexTip.x) * 24 - 12;
                        const y = (1 - indexTip.y) * 18 - 9;
                        
                        // Stabilize
                        targetHand.x = x; targetHand.y = y;
                        smoothHand.x = lerp(smoothHand.x, targetHand.x, CONFIG.smoothing);
                        smoothHand.y = lerp(smoothHand.y, targetHand.y, CONFIG.smoothing);

                        cursor.position.set(smoothHand.x, smoothHand.y, 0);

                        if (isPinching) {
                            cursor.material.color.setHex(0x00ffff); // Blue
                            cursor.material.wireframe = false;
                            
                            const snapX = Math.round(smoothHand.x / CONFIG.gridSize) * CONFIG.gridSize;
                            const snapY = Math.round(smoothHand.y / CONFIG.gridSize) * CONFIG.gridSize;
                            const key = `${snapX},${snapY}`;

                            if (!voxelMap.has(key) && voxelCount < CONFIG.maxBlocks) {
                                dummy.position.set(snapX, snapY, 0);
                                dummy.updateMatrix();
                                meshSolid.setMatrixAt(voxelCount, dummy.matrix);
                                meshWire.setMatrixAt(voxelCount, dummy.matrix);
                                
                                meshSolid.instanceMatrix.needsUpdate = true;
                                meshWire.instanceMatrix.needsUpdate = true;
                                
                                voxelMap.set(key, voxelCount);
                                voxelCount++;
                            }
                        } else {
                            cursor.material.color.setHex(0xffffff); // White
                            cursor.material.wireframe = true;
                        }
                    }

                    // ===========================================
                    // LEFT HAND (ARC REACTOR) - Label "Right"
                    // ===========================================
                    if (label === "Right") {
                        reactor.visible = true;
                        
                        // Track Palm Center (approximate using middle knuckle)
                        const palmX = (1 - landmarks[9].x) * 24 - 12;
                        const palmY = (1 - landmarks[9].y) * 18 - 9;
                        
                        // Stabilize Reactor
                        targetReactor.x = palmX; targetReactor.y = palmY;
                        smoothReactor.x = lerp(smoothReactor.x, targetReactor.x, CONFIG.smoothing);
                        smoothReactor.y = lerp(smoothReactor.y, targetReactor.y, CONFIG.smoothing);
                        
                        reactor.position.set(smoothReactor.x, smoothReactor.y, 0);

                        // FIST CHECK (RESET)
                        const isFist = landmarks[12].y > landmarks[9].y && landmarks[16].y > landmarks[13].y;
                        
                        if (isFist) {
                            // RED ALERT MODE
                            reactor.material.color.setHex(0xff0000); // Red
                            reactor.scale.set(0.8, 0.8, 0.8);
                            
                            // Reset everything instantly
                            clearAllBlocks();
                            world.rotation.set(0,0,0);
                        } 
                        else {
                            // NORMAL MODE (ROTATE)
                            reactor.material.color.setHex(0x00ffff); // Cyan
                            reactor.scale.set(1.2, 1.2, 1.2);
                            reactor.rotation.z -= 0.1; // Spin the reactor
                            
                            // Map Hand Position to World Rotation
                            // Move hand Left/Right to rotate world Y
                            const rotX = (landmarks[9].x - 0.5) * 3; 
                            world.rotation.y = rotX;
                        }
                    }
                });
            }
        }

        // --- 7. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            if(cursor.visible) { cursor.rotation.x += 0.02; cursor.rotation.y += 0.02; }
            renderer.render(scene, camera);
        }
        animate();

        // --- 8. INIT CAMERA (MOBILE FAST MODE) ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        
        hands.setOptions({ 
            maxNumHands: 2, 
            modelComplexity: 0, // LITE MODEL (Fastest)
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5 
        });
        
        hands.onResults(onResults);

        const cam = new Camera(document.getElementById('input_video'), {
            onFrame: async () => {
                await hands.send({image: document.getElementById('input_video')});
            },
            width: 640, // Reduced resolution for MAX speed
            height: 480
        });
        cam.start();

    </script>
</body>
</html>
