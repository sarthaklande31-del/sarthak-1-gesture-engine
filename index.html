<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Iron Hand – Build in Thin Air</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
  font-family:system-ui;
}
#hud{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  color:#7fffd4;
  font-size:14px;
  letter-spacing:.6px;
  opacity:.85;
}
#video{display:none;}
canvas{position:absolute;top:0;left:0;}
</style>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>

<body>
<div id="hud">PINCH = BUILD • OPEN PALM = CAMERA • DROP DOWN = DELETE</div>
<video id="video" autoplay playsinline></video>
<canvas id="overlay"></canvas>

<script>
/* ====================== OVERLAY ====================== */
const overlay=document.getElementById("overlay");
const ctx=overlay.getContext("2d");
function resize(){
  overlay.width=innerWidth;
  overlay.height=innerHeight;
}
resize(); addEventListener("resize",resize);

/* ====================== THREE ====================== */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
camera.position.set(0,6,14);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,.3));
const dl=new THREE.DirectionalLight(0xffffff,1);
dl.position.set(6,12,6);
scene.add(dl);
scene.add(new THREE.GridHelper(24,24));

/* ====================== VOXELS ====================== */
const cubeGeo=new THREE.BoxGeometry(1,1,1);
const voxels=[];
let active=null;
let buildY=0;

function snap(v){
  return new THREE.Vector3(
    Math.round(v.x),
    Math.round(v.y),
    Math.round(v.z)
  );
}

function makeCube(pos,ghost=false,color=0x00ffff){
  const mat=new THREE.MeshStandardMaterial({
    color,
    wireframe:true,
    transparent:true,
    opacity:ghost?.35:.9
  });
  const m=new THREE.Mesh(cubeGeo,mat);
  m.position.copy(pos);
  scene.add(m);
  return m;
}

let ghost=makeCube(new THREE.Vector3(),true);

/* ====================== MEDIAPIPE ====================== */
const video=document.getElementById("video");

const hands=new Hands({
  locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:.75,
  minTrackingConfidence:.75
});

hands.onResults(onResults);

new Camera(video,{
  onFrame:async()=>hands.send({image:video}),
  width:640,height:480
}).start();

/* ====================== GESTURES ====================== */
let pinch=false;
let smooth=new THREE.Vector3();
let camRot=0;

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
}
function isPinch(lm){return dist(lm[4],lm[8])<0.04;}
function openPalm(lm){return dist(lm[8],lm[12])>0.12;}

function map3D(p){
  return new THREE.Vector3(
    (p.x-.5)*12,
    (.5-p.y)*9,
    -p.z*8
  );
}

/* ====================== MAIN LOOP ====================== */
function onResults(r){
  ctx.clearRect(0,0,overlay.width,overlay.height);
  if(!r.multiHandLandmarks.length) return;

  const lm=r.multiHandLandmarks[0];

  /* IRON MAN HAND */
  drawConnectors(ctx,lm,HAND_CONNECTIONS,{color:"#00ffff",lineWidth:2});
  drawLandmarks(ctx,lm,{color:"#00ffff",radius:3});

  const target=map3D(lm[8]);
  smooth.lerp(target,.25);

  ghost.position.copy(snap(smooth));

  /* CAMERA MODE */
  if(openPalm(lm)){
    camRot+=(lm[0].x-.5)*.04;
    camera.position.x=Math.sin(camRot)*14;
    camera.position.z=Math.cos(camRot)*14;
    camera.lookAt(0,0,0);
    return;
  }

  /* BUILD MODE */
  if(isPinch(lm)&&!pinch){
    pinch=true;
    active=makeCube(
      new THREE.Vector3(
        ghost.position.x,
        buildY,
        ghost.position.z
      )
    );
    voxels.push(active);
    buildY++;
  }

  if(!isPinch(lm)&&pinch){
    pinch=false;
    if(active.position.y<-1){
      scene.remove(active);
    }
    active=null;
  }
}

/* ====================== RENDER ====================== */
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
