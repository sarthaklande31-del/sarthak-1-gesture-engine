<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OMNI-ARCHITECT V1</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Segoe UI', sans-serif; }
        #canvas-layer { position: absolute; top: 0; left: 0; z-index: 1; } /* 3D World */
        #hud-layer { position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; } /* Tech Overlay */
        #ui-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 20, 40, 0.8); border: 1px solid #00ffff;
            color: #00ffff; padding: 10px 20px; border-radius: 20px;
            font-size: 14px; z-index: 3; display: flex; gap: 20px;
            backdrop-filter: blur(5px);
        }
        .mode-active { color: #fff; text-shadow: 0 0 10px #00ffff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
    <div id="ui-panel">
        <span id="status">SYSTEM: INITIALIZING</span>
        <span>|</span>
        <span id="mode-display">MODE: NAVIGATION</span>
        <span>|</span>
        <span id="voice-indicator">MIC: OFF</span>
    </div>
    <video id="input_video" style="display:none"></video>
    <canvas id="hud-layer"></canvas>
    <script>
        // --- 1. THE ENGINE CORE ---
        const CONFIG = {
            gridSize: 1.0,
            pinchThreshold: 0.04, // Distance for pinch
            smoothing: 0.15,      // Lerp factor (Simulated filter)
            maxVoxels: 5000       // InstancedMesh limit
        };

        // State Manager
        const STATE = {
            mode: 'NAV', // NAV, BUILD, ERASE
            hand: { x: 0, y: 0, z: 0, pinching: false, gesture: 'NONE' },
            voiceCmd: null,
            voxels: [], // Data model
            history: [] // Undo stack
        };

        // --- 2. THREE.JS SETUP (Instanced Rendering) ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 10);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambient = new THREE.AmbientLight(0x404040);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Grid & Helper
        const grid = new THREE.GridHelper(50, 50, 0x00ffff, 0x222222);
        scene.add(grid);

        // --- THE VOXEL SYSTEM (InstancedMesh) ---
        // We use one mesh to render thousands of cubes
        const geometry = new THREE.BoxGeometry(CONFIG.gridSize, CONFIG.gridSize, CONFIG.gridSize);
        const material = new THREE.MeshLambertMaterial({ color: 0x00ffff });
        const voxelMesh = new THREE.InstancedMesh(geometry, material, CONFIG.maxVoxels);
        voxelMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); // Update often
        scene.add(voxelMesh);

        const dummy = new THREE.Object3D(); // Helper for matrix math

        // GHOST CURSOR (Preview)
        const ghostGeo = new THREE.BoxGeometry(CONFIG.gridSize, CONFIG.gridSize, CONFIG.gridSize);
        const ghostMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, opacity: 0.5, transparent: true });
        const ghostCursor = new THREE.Mesh(ghostGeo, ghostMat);
        scene.add(ghostCursor);

        // --- 3. INPUT MANAGER (Hand + Voice) ---
        
        // A. Voice Recognition (Web Speech API)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'en-US';
            
            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                console.log("Voice:", transcript);
                handleVoiceCommand(transcript);
            };
            recognition.start();
            document.getElementById('voice-indicator').innerText = "MIC: LISTENING";
        }

        function handleVoiceCommand(cmd) {
            // Natural Language mapping
            if (cmd.includes("create") || cmd.includes("build")) setMode('BUILD');
            if (cmd.includes("delete") || cmd.includes("erase")) setMode('ERASE');
            if (cmd.includes("undo")) performUndo();
            if (cmd.includes("red") || cmd.includes("blue")) changeColor(cmd);
        }

        // B. Hand Tracking (MediaPipe)
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7, // High confidence to reduce jitter
            minTrackingConfidence: 0.5
        });

        hands.onResults(onHandResults);

        // --- 4. CORE LOGIC LOOP ---
        
        function onHandResults(results) {
            if (results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0]; // Primary Hand
                
                // 1. Get Coordinates & Stabilize
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                
                // Map 2D screen to 3D Raycaster plane (Simplified projection for demo)
                const x = (indexTip.x - 0.5) * -20; 
                const y = (indexTip.y - 0.5) * -15; 
                const z = 0; // Fixed depth plane for simplicity

                // Smoothing (Simple LERP)
                STATE.hand.x += (x - STATE.hand.x) * CONFIG.smoothing;
                STATE.hand.y += (y - STATE.hand.y) * CONFIG.smoothing;

                // 2. Gesture Detection: PINCH
                const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                const isPinching = pinchDist < CONFIG.pinchThreshold;

                // 3. Logic based on Mode
                updateCursor(STATE.hand.x, STATE.hand.y);

                if (isPinching && !STATE.hand.pinching) {
                    // Pinch STARTED
                    if (STATE.mode === 'BUILD') placeVoxel();
                    if (STATE.mode === 'ERASE') removeVoxel();
                }
                STATE.hand.pinching = isPinching;
            }
        }

        // --- 5. VOXEL OPERATIONS ---

        function updateCursor(x, y) {
            // Snap to Grid
            const snapX = Math.round(x / CONFIG.gridSize) * CONFIG.gridSize;
            const snapY = Math.round(y / CONFIG.gridSize) * CONFIG.gridSize;
            
            ghostCursor.position.set(snapX, snapY, 0);
            
            // Visual feedback based on mode
            if (STATE.mode === 'BUILD') ghostCursor.material.color.setHex(0x00ff00);
            else if (STATE.mode === 'ERASE') ghostCursor.material.color.setHex(0xff0000);
            else ghostCursor.material.color.setHex(0xffffff);
        }

        function placeVoxel() {
            const pos = ghostCursor.position;
            
            // Check for duplicates
            const key = `${pos.x},${pos.y},${pos.z}`;
            if (STATE.voxels.some(v => v.key === key)) return;

            // Add to Data Model
            STATE.voxels.push({ x: pos.x, y: pos.y, z: pos.z, key: key });
            
            // Update InstancedMesh
            updateVoxelMesh();
            
            // Add to History (Undo)
            STATE.history.push({ type: 'ADD', key: key });
        }

        function removeVoxel() {
            // Find voxel at cursor
            const pos = ghostCursor.position;
            const key = `${pos.x},${pos.y},${pos.z}`;
            const idx = STATE.voxels.findIndex(v => v.key === key);
            
            if (idx !== -1) {
                STATE.voxels.splice(idx, 1);
                updateVoxelMesh();
                STATE.history.push({ type: 'REMOVE', data: {x: pos.x, y: pos.y, z: pos.z, key: key} });
            }
        }

        function updateVoxelMesh() {
            // Re-draw all instances
            STATE.voxels.forEach((v, i) => {
                dummy.position.set(v.x, v.y, v.z);
                dummy.updateMatrix();
                voxelMesh.setMatrixAt(i, dummy.matrix);
            });
            // Hide unused instances
            for (let i = STATE.voxels.length; i < CONFIG.maxVoxels; i++) {
                dummy.position.set(0, 0, 10000);
                dummy.updateMatrix();
                voxelMesh.setMatrixAt(i, dummy.matrix);
            }
            voxelMesh.instanceMatrix.needsUpdate = true;
            voxelMesh.count = STATE.voxels.length;
        }

        function performUndo() {
            if (STATE.history.length === 0) return;
            const action = STATE.history.pop();
            
            if (action.type === 'ADD') {
                // Reverse ADD = Remove
                const idx = STATE.voxels.findIndex(v => v.key === action.key);
                if (idx !== -1) STATE.voxels.splice(idx, 1);
            } else if (action.type === 'REMOVE') {
                // Reverse REMOVE = Add
                STATE.voxels.push(action.data);
            }
            updateVoxelMesh();
            console.log("Undo performed");
        }

        function setMode(newMode) {
            STATE.mode = newMode;
            document.getElementById('mode-display').innerText = "MODE: " + newMode;
        }

        // --- 6. RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            ghostCursor.rotation.y += 0.02; // Idle animation
            renderer.render(scene, camera);
        }
        animate();

        // --- 7. INITIALIZATION ---
        const videoElement = document.getElementById('input_video');
        const cam = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });
        cam.start();
        document.getElementById('status').innerText = "SYSTEM: READY";
    </script>
</body>
</html>
